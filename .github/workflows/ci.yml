name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支只保留最新一次运行，避免排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 / lint / 单测 / 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-pwa

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile-pwa/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + lint
        run: npm run check

      - name: 引擎单测
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: mobile-pwa/dist
          retention-days: 7
