<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#DCCDAE}
  iframe{width:390px;height:844px;border:0;display:block}
</style></head>
<body>
<iframe id="f" src="http://127.0.0.1:5199/game/?tab=town"></iframe>
<script>
  const f = document.getElementById('f');
  f.addEventListener('load', () => {
    setTimeout(() => {
      try {
        const d = f.contentDocument;
        if (!d) return;
        const btns = [...d.querySelectorAll('button')];
        const take = btns.find(b => b.textContent && b.textContent.replace(/\s/g, '').includes('接取'));
        if (take) take.click();
      } catch (e) {
        document.title = 'ERR ' + e.message;
      }
    }, 1500);
  });
</script>
</body></html>
